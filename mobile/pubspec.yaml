name: smartglow_mobile
description: "SmartGlow AI-powered cosmetics e-commerce mobile application for iOS and Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.1
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
